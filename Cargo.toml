[package]
name = "wasmrs"
version = "0.1.0"
edition = "2024"

[features]
default = ["debug-errors"]
spec-tests = ["dep:wast"]
debug-errors = ["dep:dbg_breakpoint"]

[dependencies]
anyhow = "1.0.100"
dbg_breakpoint = { version = "0.1.1", optional = true }
wast = { version = "223", optional = true }

[dev-dependencies]
libtest-mimic = "0.8.1"

[[bin]]
name = "wast_debug"
path = "tools/wast_debug.rs"
required-features = ["spec-tests"]

[[test]]
name = "wast_runner"
harness = false
required-features = ["spec-tests"]
